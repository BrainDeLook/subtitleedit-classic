name: Build Subtitle Edit Classic Installer

on:
  push:
    branches: [se4-legacy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Build the classic Windows Forms solution
        shell: pwsh
        run: |
          $sdk = Get-ChildItem 'C:/Program Files/dotnet/sdk' -Directory | Where-Object Name -like '8.0.*' | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          @{ sdk = @{ version = $sdk.Name; rollForward = 'latestPatch' } } | ConvertTo-Json | Set-Content global.json
          # Generate these files before the solution is evaluated, so fresh checkouts
          # include them in the default Compile glob and receive the correct version.
          msbuild src/UpdateAssemblyInfo/UpdateAssemblyInfo.csproj /restore /p:Configuration=Release /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./src/UpdateAssemblyInfo/bin/Release/net48/win-x64/UpdateAssemblyInfo.exe src/ui/Properties/AssemblyInfo.cs.template src/libse/Properties/AssemblyInfo.cs.template
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild SubtitleEdit.sln /restore /p:Configuration=Release /p:SolutionDir="$env:GITHUB_WORKSPACE\" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exeVersion = (Get-Item 'src/ui/bin/Release/net48/SubtitleEdit.exe').VersionInfo.FileVersion
          Write-Output "Compiled application version: $exeVersion"
          if ($exeVersion -notmatch '^4\.0\.22\.') { throw "Expected Classic 4.0.22, got $exeVersion." }
      - name: Find or install the Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup compiler was not found.' }
          "CLASSIC_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile the normal Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          & $env:CLASSIC_ISCC /DCLASSIC_FORK "/O$outputDirectory" installer/Subtitle_Edit_installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Join-Path $outputDirectory 'SubtitleEdit-Classic-4.0.22-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup)) { throw 'Installer output was not found.' }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SubtitleEdit-Classic-4.0.22-Setup.exe" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Test installer and application startup on the CI machine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:GITHUB_WORKSPACE 'artifacts/SubtitleEdit-Classic-4.0.22-Setup.exe'
          $installDirectory = Join-Path $env:RUNNER_TEMP 'SubtitleEditClassicTest'
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installDirectory", '/NOICONS', '/TASKS=') -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)." }
          $installedExe = Join-Path $installDirectory 'SubtitleEdit.exe'
          $compiledExe = Join-Path $env:GITHUB_WORKSPACE 'src/ui/bin/Release/net48/SubtitleEdit.exe'
          if ((Get-FileHash $installedExe).Hash -ne (Get-FileHash $compiledExe).Hash) { throw 'Installed executable differs from the compiled executable.' }
          $languageTest = Join-Path $installDirectory 'TestClassicLanguages.exe'
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /target:exe /platform:x64 "/out:$languageTest" /reference:System.Windows.Forms.dll (Join-Path $env:GITHUB_WORKSPACE 'installer\TestClassicLanguages.cs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $languageTest
          if ($LASTEXITCODE -ne 0) { throw 'Installed language picker test failed.' }
          $app = Start-Process -FilePath $installedExe -WorkingDirectory $installDirectory -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 6
          if ($app.HasExited) { throw "Application exited during startup with code $($app.ExitCode)." }
          Stop-Process -Id $app.Id
          Write-Output 'Installer extraction and application startup passed.'
          & ./installer/speech-tests/Test-Speech.ps1 -ApplicationDirectory $installDirectory -OutputDirectory (Join-Path $env:RUNNER_TEMP 'ClassicSpeechTests') -DownloadSmoke
          if ($LASTEXITCODE -ne 0) { throw 'Installed speech/scrolling tests failed.' }
      - name: Test installed OCR, TTS and ASS canvas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ffmpeg) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $ffmpeg = Get-Command ffmpeg -ErrorAction Stop
          }
          & ./installer/Test-ClassicMedia.ps1 -FFmpegLocation $ffmpeg.Source -ApplicationDirectory (Join-Path $env:RUNNER_TEMP 'SubtitleEditClassicTest') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'ClassicMediaTests')
          if ($LASTEXITCODE -ne 0) { throw 'Installed OCR/TTS/canvas checks failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: SubtitleEdit-Classic-Installer
          path: |
            artifacts/SubtitleEdit-Classic-4.0.22-Setup.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
